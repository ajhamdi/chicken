<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dragon body - damaged/hit state -->
  <ellipse cx="32" cy="38" rx="18" ry="14" fill="#555"/>
  <ellipse cx="32" cy="38" rx="16" ry="12" fill="#777"/>
  <!-- Belly -->
  <ellipse cx="32" cy="42" rx="10" ry="8" fill="#999"/>
  <ellipse cx="32" cy="42" rx="8" ry="6" fill="#aaa"/>
  <!-- Head - tilted back in defeat -->
  <ellipse cx="32" cy="18" rx="12" ry="10" fill="#777"/>
  <ellipse cx="32" cy="20" rx="10" ry="8" fill="#888"/>
  <!-- Eyes - X marks (dead) -->
  <g transform="translate(26,16)" stroke="#FF0000" stroke-width="1.5" fill="none">
    <line x1="-2" y1="-2" x2="2" y2="2"/>
    <line x1="2" y1="-2" x2="-2" y2="2"/>
  </g>
  <g transform="translate(38,16)" stroke="#FF0000" stroke-width="1.5" fill="none">
    <line x1="-2" y1="-2" x2="2" y2="2"/>
    <line x1="2" y1="-2" x2="-2" y2="2"/>
  </g>
  <!-- Horns - broken -->
  <path d="M22 12 L18 5 L24 10 Z" fill="#333"/>
  <path d="M42 12 L46 5 L40 10 Z" fill="#333"/>
  <!-- Snout -->
  <ellipse cx="32" cy="24" rx="5" ry="3" fill="#666"/>
  <!-- Wings - damaged/drooping -->
  <path d="M14 30 Q4 22 10 14 Q14 20 16 28" fill="#555" opacity="0.7"/>
  <path d="M50 30 Q60 22 54 14 Q50 20 48 28" fill="#555" opacity="0.7"/>
  <!-- Tail - drooping -->
  <path d="M14 40 Q8 46 6 52 Q4 56 8 56 L12 52 Q10 48 14 42" fill="#777"/>
  <!-- Spikes dimmed -->
  <polygon points="26,26 28,20 30,26" fill="#888"/>
  <polygon points="30,25 32,18 34,25" fill="#888"/>
  <polygon points="34,26 36,20 38,26" fill="#888"/>
  <!-- Damage cracks -->
  <line x1="24" y1="34" x2="28" y2="40" stroke="#FF4400" stroke-width="1" opacity="0.8"/>
  <line x1="36" y1="32" x2="40" y2="38" stroke="#FF4400" stroke-width="1" opacity="0.8"/>
  <line x1="30" y1="30" x2="34" y2="36" stroke="#FF4400" stroke-width="1" opacity="0.8"/>
  <!-- Feet -->
  <path d="M22 50 L18 56 L21 54 L24 56 L26 50" fill="#666"/>
  <path d="M38 50 L36 56 L39 54 L42 56 L42 50" fill="#666"/>
  <!-- Smoke puffs from damage -->
  <circle cx="20" cy="28" r="3" fill="#aaa" opacity="0.4"/>
  <circle cx="44" cy="30" r="2.5" fill="#aaa" opacity="0.3"/>
  <circle cx="32" cy="10" r="2" fill="#aaa" opacity="0.3"/>
</svg>
