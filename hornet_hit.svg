<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dead Hornet - crumpled, X eyes -->
  <!-- Crumpled wings -->
  <ellipse cx="18" cy="24" rx="10" ry="4" fill="rgba(180,200,230,0.3)" stroke="rgba(130,160,200,0.4)" stroke-width="0.5" transform="rotate(-35 18 24)"/>
  <ellipse cx="46" cy="24" rx="10" ry="4" fill="rgba(180,200,230,0.3)" stroke="rgba(130,160,200,0.4)" stroke-width="0.5" transform="rotate(35 46 24)"/>
  <!-- Head -->
  <circle cx="32" cy="18" r="7" fill="#1a2530"/>
  <!-- X Eyes (dead) -->
  <line x1="26" y1="15" x2="30" y2="19" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="15" x2="26" y2="19" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="15" x2="38" y2="19" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="15" x2="34" y2="19" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Limp antennae -->
  <path d="M26,12 Q24,8 20,10" stroke="#1a2530" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M38,12 Q40,8 44,10" stroke="#1a2530" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Thorax -->
  <ellipse cx="32" cy="30" rx="7" ry="5" fill="#1a2530" opacity="0.8"/>
  <!-- Abdomen with faded stripes -->
  <ellipse cx="32" cy="44" rx="9" ry="12" fill="#BFA524" opacity="0.7"/>
  <rect x="23" y="37" width="18" height="3.5" fill="#1a2530" rx="2" opacity="0.5"/>
  <rect x="24" y="42" width="16" height="3" fill="#1a2530" rx="2" opacity="0.5"/>
  <rect x="25" y="47" width="14" height="2.5" fill="#1a2530" rx="2" opacity="0.5"/>
  <!-- Bent stinger -->
  <polygon points="32,56 30,53 34,53" fill="#8B2020" opacity="0.6"/>
  <!-- Limp legs -->
  <line x1="26" y1="32" x2="14" y2="42" stroke="#1a2530" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="26" y1="36" x2="12" y2="46" stroke="#1a2530" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="38" y1="32" x2="50" y2="42" stroke="#1a2530" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="38" y1="36" x2="52" y2="46" stroke="#1a2530" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Dizzy swirl -->
  <path d="M28,8 Q32,5 36,8" stroke="#999" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M30,6 Q32,3 34,6" stroke="#999" stroke-width="1" fill="none" opacity="0.5"/>
</svg>
