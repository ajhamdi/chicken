<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Hornet/Wasp -->
  <!-- Wings -->
  <ellipse cx="20" cy="22" rx="12" ry="6" fill="rgba(200,220,255,0.5)" stroke="rgba(150,180,220,0.6)" stroke-width="0.5" transform="rotate(-20 20 22)"/>
  <ellipse cx="44" cy="22" rx="12" ry="6" fill="rgba(200,220,255,0.5)" stroke="rgba(150,180,220,0.6)" stroke-width="0.5" transform="rotate(20 44 22)"/>
  <!-- Head -->
  <circle cx="32" cy="16" r="8" fill="#2C3E50"/>
  <circle cx="32" cy="15" r="7" fill="#34495E"/>
  <!-- Antennae -->
  <path d="M26,10 Q22,2 18,4" stroke="#2C3E50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M38,10 Q42,2 46,4" stroke="#2C3E50" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <circle cx="18" cy="4" r="1.5" fill="#F39C12"/>
  <circle cx="46" cy="4" r="1.5" fill="#F39C12"/>
  <!-- Eyes -->
  <ellipse cx="28" cy="14" rx="3" ry="3.5" fill="#E74C3C"/>
  <ellipse cx="36" cy="14" rx="3" ry="3.5" fill="#E74C3C"/>
  <circle cx="29" cy="13" r="1.2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="37" cy="13" r="1.2" fill="#FFFFFF" opacity="0.6"/>
  <!-- Thorax -->
  <ellipse cx="32" cy="28" rx="8" ry="6" fill="#2C3E50"/>
  <!-- Abdomen with stripes -->
  <ellipse cx="32" cy="44" rx="10" ry="14" fill="#F1C40F"/>
  <rect x="22" y="36" width="20" height="4" fill="#2C3E50" rx="2"/>
  <rect x="23" y="42" width="18" height="3.5" fill="#2C3E50" rx="2"/>
  <rect x="24" y="48" width="16" height="3" fill="#2C3E50" rx="2"/>
  <!-- Stinger -->
  <polygon points="32,58 29,55 35,55" fill="#C0392B"/>
  <line x1="32" y1="58" x2="32" y2="62" stroke="#C0392B" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="26" y1="30" x2="16" y2="36" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="34" x2="14" y2="40" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="30" x2="48" y2="36" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="34" x2="50" y2="40" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Mandibles -->
  <path d="M28,20 Q26,24 28,22" stroke="#8B4513" stroke-width="1" fill="none"/>
  <path d="M36,20 Q38,24 36,22" stroke="#8B4513" stroke-width="1" fill="none"/>
</svg>
