  <ellipse cx="32" cy="36" rx="18" ry="12" fill="#A93226"/>
  <ellipse cx="32" cy="38" rx="16" ry="10" fill="#CB4335"/>
  <ellipse cx="32" cy="39" rx="10" ry="6" fill="#922B21" opacity="0.4"/>
  <!-- X Eyes (dead) -->
  <line x1="22" y1="30" x2="18" y2="22" stroke="#A93226" stroke-width="3" stroke-linecap="round"/>
  <circle cx="18" cy="20" r="4" fill="#DDDDDD"/>
  <line x1="16" y1="18" x2="20" y2="22" stroke="#666" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="18" x2="16" y2="22" stroke="#666" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46" cy="20" r="4" fill="#DDDDDD"/>
