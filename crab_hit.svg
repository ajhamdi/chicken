  <line x1="48" y1="18" x2="44" y2="22" stroke="#666" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="30" x2="46" y2="22" stroke="#A93226" stroke-width="3" stroke-linecap="round"/>
  <!-- Limp claws -->
  <path d="M14,36 Q6,40 8,44 Q10,48 14,44" fill="#A93226" stroke="#922B21" stroke-width="1" opacity="0.7"/>
  <path d="M50,36 Q58,40 56,44 Q54,48 50,44" fill="#A93226" stroke="#922B21" stroke-width="1" opacity="0.7"/>
  <!-- Legs pointing up (flipped) -->
