  <line x1="20" y1="26" x2="14" y2="14" stroke="#A93226" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="22" y1="26" x2="18" y2="12" stroke="#A93226" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="46" y1="28" x2="54" y2="18" stroke="#A93226" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="44" y1="26" x2="50" y2="14" stroke="#A93226" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="42" y1="26" x2="46" y2="12" stroke="#A93226" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Dizzy mouth -->
  <path d="M28,46 Q32,43 36,46" stroke="#922B21" stroke-width="1.5" fill="none"/>
