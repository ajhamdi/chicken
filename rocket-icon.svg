<svg xmlns="http://www.w3.org/2000/svg" width="60" height="40" viewBox="0 0 60 40">
  <!-- Launcher tube -->
  <rect x="5" y="12" width="45" height="14" rx="7" fill="#556B2F"/>
  <rect x="5" y="12" width="45" height="14" rx="7" fill="none" stroke="#3a4a20" stroke-width="1"/>
  <!-- Tube opening -->
  <ellipse cx="50" cy="19" rx="3" ry="7" fill="#444" stroke="#333" stroke-width="1"/>
  <!-- Rear opening -->
  <ellipse cx="5" cy="19" rx="2" ry="6" fill="#444" stroke="#333" stroke-width="1"/>
  <!-- Grip -->
  <rect x="20" y="24" width="7" height="12" rx="2" fill="#444"/>
  <!-- Trigger -->
  <path d="M22,28 Q18,34 22,36" fill="none" stroke="#555" stroke-width="1.5"/>
  <!-- Sight -->
  <rect x="32" y="8" width="2" height="5" fill="#556B2F"/>
  <rect x="30" y="7" width="6" height="2" fill="#556B2F"/>
  <!-- Shoulder rest -->
  <rect x="2" y="14" width="6" height="10" rx="3" fill="#444"/>
  <!-- Warhead peeking out -->
  <polygon points="50,14 56,19 50,24" fill="#cc3333"/>
  <polygon points="56,17 60,19 56,21" fill="#ff4444"/>
  <!-- Stripe on rocket -->
  <line x1="53" y1="15" x2="53" y2="23" stroke="#ffcc00" stroke-width="1.5"/>
</svg>
